[package]
name = "con-desktop"
version = "0.1.0"
edition = "2021"
description = "Linux and Windows platform layer for Con: system keyring, FFmpeg image and video decoding, SDL rendering, Direct3D 11 upscaling."
publish = false

[lib]
name = "con_desktop"
crate-type = ["staticlib", "rlib"]

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
libc = "0.2"
sdl2-sys = { version = "0.38", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader"]

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
pkg-config = "0.3"
