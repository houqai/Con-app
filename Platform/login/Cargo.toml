[package]
name = "con-login"
version = "0.1.0"
edition = "2021"
description = "Sign-in window for Con: Sony's sign-in page in WebKitGTK on Linux and WebView2 on Windows."
publish = false

[[bin]]
name = "con-login"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = "0.6"
gtk4 = { version = "0.11", features = ["v4_10"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
