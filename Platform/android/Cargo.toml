[package]
name = "con-android"
version = "0.1.0"
edition = "2021"
description = "Android layer of Con: the JNI bridge between the Java app and the Swift code, video decoding with MediaCodec onto the app surface, and audio output with AAudio."
publish = false

[lib]
name = "con_android"
crate-type = ["staticlib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
ndk-sys = { version = "0.6", features = ["audio", "media"] }
