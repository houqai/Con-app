language = "C"
pragma_once = true
cpp_compat = false
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
style = "both"
documentation = false
line_length = 100
tab_width = 4
include_version = false

[parse]
parse_deps = false

[export]
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]

[fn]
args = "auto"
sort_by = "None"

[struct]
derive_constructor = false

[const]
allow_static_const = false
sort_by = "None"
