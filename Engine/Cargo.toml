[package]
name = "con-engine"
version = "0.1.0"
edition = "2021"
description = "Independent Remote Play stream engine for Con, written from the protocol description in docs/protocol."
publish = false

[lib]
name = "con_engine"
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = "0.8"
cfb-mode = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "std"] }
rand = "0.8"
base64 = "0.22"
thiserror = "2"
socket2 = "0.6"
opus = { version = "0.4", optional = true }

[features]
default = ["opus"]
opus = ["dep:opus"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cbindgen = { version = "=0.29.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[[test]]
name = "media"
required-features = ["opus"]

[[test]]
name = "media_session"
required-features = ["opus"]

[[test]]
name = "c_api"
required-features = ["opus"]
